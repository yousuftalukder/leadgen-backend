# Every push and every pull request runs the whole suite and the wiring audit.
#
# `npm install`, not `npm ci`: there is no lockfile by design. Since phase 31
# the XpulseAI modules under xp/ need luxon, axios, node-cron and @google/genai
# at load; the tests still stub express, supabase, apify-client and the model.
#
# Render deploys whatever lands on main. Until this file existed, a broken
# push went live; the tests only ran when someone remembered.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Syntax
        run: node --check server.js && node --check frontend/header.js
      - name: Suite
        run: npm test
      - name: Wiring audit
        run: npm run audit
