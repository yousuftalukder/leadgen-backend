<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://leadgen-backend-1-mgzc.onrender.com">
    <title>Monthly report — EdgeLead</title>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wdth,wght@75..125,300..800&family=Anek+Bangla:wdth,wght@75..125,400..700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="app.css">
    <style>
    /* monthly.html — page-specific only. The report itself is rp-* in app.css. */
    .mr-top { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .mr-top .ws-crumb { margin: 0; }
    .mr-top select { width: auto; min-width: 200px; }
    </style>
</head>
<body class="el-has-header">

<main class="el-page" id="mr"><div class="ws-empty"><p>Loading the report…</p></div></main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script src="header.js"></script>
<script src="report-view.js"></script>
<script>
(async () => {
    'use strict';
    // The monthly report as the agency sends it: the same document the owner
    // reads in their portal and on a share link, with two things only staff
    // have: the recommendations can go onto the client's task board, and the
    // share, repeat and PDF actions.
    await EL.init({ engine: 'meta_owned', page: 'monthly.html' });
    const esc = v => EL.esc(v);
    const root = document.getElementById('mr');
    const embedded = EL.isEmbedded();
    let months = [];

    const monthName = snap => {
        const d = new Date(String(snap || '').slice(0, 10) + 'T00:00:00Z');
        return isNaN(d) ? String(snap || '') : d.toLocaleDateString('en-US', { month: 'long', year: 'numeric', timeZone: 'UTC' });
    };
    const empty = (title, body, action) => {
        root.innerHTML = `<div class="ws-empty">${EL.icon('doc')}<h3>${esc(title)}</h3><p>${body}</p>${action || ''}</div>`;
    };

    try { months = (await EL.api('/api/meta/monthly')).reports || []; }
    catch (err) { if (!err.handled) empty('The monthly reports could not be loaded', esc(err.message)); return; }

    const want = EL.reportParam();
    if (!want && !months.length) {
        const cid = EL.clientId();
        const cl = cid ? (EL.clients ? (await EL.clients()).find(c => c.id === cid) : null) : null;
        return empty(cl ? `No monthly report for ${cl.name} yet` : 'No monthly report yet',
            'A monthly report reads a client’s own Meta numbers for one finished month and sets it against the month before. Build one from the client’s Meta tab once their Page is connected.',
            cl ? `<a class="ws-btn is-gold" href="workspace.html?client=${encodeURIComponent(cl.id)}&tab=meta">Open ${esc(cl.name)}’s Meta tab</a>`
               : '<a class="ws-btn is-gold" href="clients.html">Choose a client</a>');
    }
    await load(want || months[0].id);

    async function load(id) {
        let d;
        try { d = await EL.api('/api/meta/report/' + encodeURIComponent(id)); }
        catch (err) { if (!err.handled) empty('That report could not be opened', esc(err.message)); return; }
        const rep = d.report || {};
        const v = d.view;
        if (!v) {
            // The page arrived before the server that writes the document.
            return empty('This report is being upgraded', 'The server is still deploying the new report layout. Reload in a minute or two.',
                '<a class="ws-btn" href="">Reload</a>');
        }

        const name = (v.context && v.context.client && v.context.client.name) || (v.cover.account && (v.cover.account.pageName || v.cover.account.igUsername)) || 'Monthly report';
        // Browsers name a saved PDF after the title.
        document.title = `${name} · Monthly report · ${v.cover.monthLabel || ''} — EdgeLead`;

        const picker = months.length > 1 ? `<select id="mr-sel" aria-label="Which month to show">${months.map(m =>
            `<option value="${esc(m.id)}" ${m.id === rep.id ? 'selected' : ''}>${esc(monthName(m.snapshot_date))}${m.target_handle ? ' · ' + esc(m.target_handle) : ''}</option>`).join('')}</select>` : '';
        const crumb = !embedded && rep.client_id
            ? `<nav class="ws-crumb" aria-label="Breadcrumb"><a href="clients.html">Clients</a><span>/</span><a href="workspace.html?client=${encodeURIComponent(rep.client_id)}&tab=meta">${esc(name)}</a><span>/</span><span>Monthly report</span></nav>`
            : '<span></span>';
        const toolbar = `<button class="ws-btn is-sm" type="button" id="export-pdf">${EL.icon('doc')}Save as PDF</button><div id="report-actions"></div>`;

        root.innerHTML = `${crumb || picker ? `<div class="mr-top no-print">${crumb}${picker}</div>` : ''}${ELReport.monthly(v, { toolbar, tasks: v.tasks })}`;
        ELReport.wire(root, v, { tasks: v.tasks, reportId: rep.id });
        document.getElementById('export-pdf').addEventListener('click', () => window.print());
        if (document.getElementById('mr-sel')) document.getElementById('mr-sel').addEventListener('change', e => load(e.target.value));
        EL.reportActions('report-actions', { reportId: rep.id });

        const q = new URLSearchParams(location.search);
        q.set('report', rep.id);
        history.replaceState(null, '', 'monthly.html?' + q.toString());
    }
})();
</script>

</body>
</html>
