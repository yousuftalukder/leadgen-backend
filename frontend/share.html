<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://leadgen-backend-1-mgzc.onrender.com">
    <title>Your report — EdgeLead</title>
    <!-- Shared links are sent to clients, not indexed. -->
    <meta name="robots" content="noindex, nofollow">
    <link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wdth,wght@75..125,300..800&family=Anek+Bangla:wdth,wght@75..125,400..700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="app.css">
    <style>
    /* share.html — page-specific only. Shared rules live in app.css. */

    .sh-wrap { max-width: 820px; margin: 0 auto; }

    .sh-head { margin-bottom: 6px; }
    .sh-head h1 { font-size: 1.85rem; font-weight: 800; line-height: 1.22; margin-bottom: 10px; }
    .sh-sub { color: var(--text-muted); font-size: 0.86rem; }

    .sh-flag { margin: 16px 0; padding: 13px 16px; border-radius: var(--r-md); font-size: 0.86rem;
        line-height: 1.55; background: rgba(251,191,36,0.09); border: 1px solid rgba(251,191,36,0.26); color: #fcd34d; }

    .sh-standing { margin: 22px 0; padding: 26px; border-radius: var(--r-lg);
        background: linear-gradient(135deg, rgba(12,120,86,0.20), rgba(184,145,63,0.10));
        border: 1px solid rgba(63,191,143,0.24); }
    .sh-standing h2 { font-size: 1.3rem; font-weight: 800; line-height: 1.35; margin-bottom: 10px; }
    .sh-standing p { color: var(--text-secondary); font-size: 0.92rem; line-height: 1.6; }

    .sh-ranks { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
    .sh-rank { flex: 1 1 88px; padding: 12px 10px; border-radius: var(--r-sm); text-align: center;
        background: rgba(4,16,11,0.45); border: 1px solid var(--card-border); }
    .sh-rank.is-you { background: rgba(63,191,143,0.18); border-color: var(--jade); }
    .sh-rank .sh-pos { font-size: 0.68rem; color: var(--text-muted); font-weight: 700; letter-spacing: 0.05em; }
    .sh-rank .sh-who { font-size: 0.84rem; font-weight: 700; margin-top: 3px; word-break: break-word; }
    .sh-rank.is-you .sh-who { color: #a7f3d0; }
    @media (max-width: 520px) {
        .sh-rank { flex: 1 1 calc(50% - 4px); }
        .sh-rank .sh-who { font-size: 0.74rem; }
    }

    .sh-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 8px; }
    @media (max-width: 760px) { .sh-cols { grid-template-columns: 1fr; } }

    .sh-panel h3 { font-size: 1rem; font-weight: 800; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .sh-points { list-style: none; display: grid; gap: 13px; }
    .sh-point { padding: 14px 16px; border-radius: var(--r-md); background: rgba(4,16,11,0.35);
        border: 1px solid var(--card-border); border-left-width: 3px; }
    .sh-point.good { border-left-color: var(--success); }
    .sh-point.todo { border-left-color: var(--warn); }
    .sh-point b { display: block; font-size: 0.89rem; font-weight: 700; line-height: 1.45; margin-bottom: 5px; }
    .sh-point span { font-size: 0.8rem; color: var(--text-muted); line-height: 1.5; }

    .sh-missing { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .sh-missing li { font-size: 0.8rem; padding: 6px 11px; border-radius: var(--r-sm);
        background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.22); color: #fca5a5; }

    /* Content plan: one card per thing to make. Numbered, because this is a
       list somebody works through rather than reads. */
    .sh-ideas { display: grid; gap: 14px; margin-top: 8px; }
    .sh-idea { margin-bottom: 0; }
    .sh-idea-top { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 10px; }
    .sh-idea-n { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 8px; display: grid;
        place-items: center; font-size: 0.78rem; font-weight: 800;
        background: var(--accent-glow); color: var(--on-accent); }
    .sh-idea-top b { display: block; font-size: 0.98rem; font-weight: 800; line-height: 1.35; }
    .sh-idea-hook { font-size: 0.95rem; line-height: 1.55; color: var(--text-primary);
        padding: 12px 15px; border-radius: var(--r-md); margin: 10px 0;
        background: rgba(217,181,108,0.08); border-left: 3px solid var(--accent-solid); }
    .sh-script { margin: 10px 0 10px 20px; display: grid; gap: 6px; }
    .sh-script li { font-size: 0.87rem; line-height: 1.55; color: var(--text-secondary); }
    .sh-idea-meta { font-size: 0.83rem; line-height: 1.6; color: var(--text-muted); margin-top: 8px; }
    .sh-idea-meta b { color: var(--text-primary); font-weight: 700; }

    .sh-rooms { display: grid; gap: 8px; margin-top: 12px; }
    .sh-room { display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
        flex-wrap: wrap; padding: 11px 14px; border-radius: var(--r-sm);
        background: rgba(4,16,11,0.35); border: 1px solid var(--card-border); }
    .sh-room b { font-size: 0.88rem; font-weight: 700; }
    .sh-room span { font-size: 0.78rem; color: var(--text-muted); }

    .sh-foot { margin-top: 34px; padding-top: 20px; border-top: 1px solid var(--card-border);
        font-size: 0.8rem; color: var(--text-muted); line-height: 1.6; text-align: center; }

    .sh-state { text-align: center; padding: 70px 24px; color: var(--text-muted); }
    .sh-state .sh-mark { font-size: 2.6rem; margin-bottom: 14px; }
    .sh-state h2 { font-size: 1.15rem; font-weight: 700; color: var(--text-primary); margin-bottom: 10px; }
    .sh-state p { font-size: 0.9rem; line-height: 1.6; max-width: 420px; margin: 0 auto; }
    </style>
</head>
<body class="el-share">

<div class="el-page sh-wrap" id="sh-body">
    <div class="sh-state"><div class="sh-mark">📄</div><h2>Opening your report…</h2></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="header.js"></script>
<script>
(function () {
    'use strict';

    const $ = id => document.getElementById(id);
    let esc = v => String(v ?? '');

    document.addEventListener('DOMContentLoaded', async () => {
        // Share mode: EL.init needs no session, renders the read-only bar and
        // resolves immediately. This page is only ever reached by link.
        await EL.init({ page: 'share.html' });
        esc = EL.escape;

        if (!EL.isShared()) {
            return state('📄', 'Nothing to show',
                'This page opens a report someone shared with you. The link you followed has no report on it.');
        }

        try {
            const d = await EL.loadShared();
            render(d.report, d.client, d.shared);
        } catch (err) {
            // The three ways a link stops working each deserve their own words.
            const m = String(err.message || '');
            if (/expired/i.test(m))      return state('⌛', 'This link has expired', 'Ask whoever sent it for a fresh one.');
            if (/turned off/i.test(m))   return state('🔒', 'This link was turned off', 'Ask whoever sent it for a new one.');
            if (/not found|deleted/i.test(m)) return state('📄', 'Report not found', 'The report behind this link is no longer available.');
            state('⚠️', 'Could not open the report', m || 'Try again in a moment.');
        }
    });

    function state(mark, title, body) {
        $('sh-body').innerHTML = `<div class="sh-state"><div class="sh-mark">${mark}</div>
            <h2>${esc(title)}</h2><p>${esc(body)}</p></div>`;
    }

    function render(r, client, shared) {
        if (!r) return state('📄', 'This report is empty', 'Nothing was saved for it.');

        const st = r.standing || {};
        const ranks = (st.peers || []).length ? `
            <div class="sh-ranks">
                ${st.peers.map(p => `
                    <div class="sh-rank ${p.is_you ? 'is-you' : ''}">
                        <div class="sh-pos">#${p.position}</div>
                        <div class="sh-who">${esc(p.name)}</div>
                    </div>`).join('')}
            </div>` : '';

        const standing = st.verdict ? `
            <section class="sh-standing">
                <h2>${esc(st.verdict)}</h2>
                ${st.gap ? `<p>${esc(st.gap)}</p>` : ''}
                ${ranks}
            </section>` : '';

        const points = (list, cls) => list.length ? `
            <ul class="sh-points">
                ${list.map(p => `<li class="sh-point ${cls}"><b>${esc(p.title)}</b><span>${esc(p.why)}</span></li>`).join('')}
            </ul>` : `<p class="sh-sub">Nothing stood out here.</p>`;

        const missing = (r.profile && r.profile.missing) || [];
        const who = (client && (client.brand || client.name)) || (r.handle ? '@' + r.handle : '');
        const validUntil = shared && shared.expiresAt
            ? new Date(shared.expiresAt).toLocaleDateString() : null;

        $('sh-body').innerHTML = `
            <div class="sh-head">
                <h1>${esc(r.headline)}</h1>
                <div class="sh-sub">
                    ${who ? esc(who) + ' · ' : ''}${esc(r.date || '')}
                    ${r.posts_looked_at ? ' · based on ' + r.posts_looked_at + ' recent posts' : ''}
                    ${r.grade ? ' · grade ' + esc(r.grade) : ''}
                </div>
            </div>

            ${r.provisional ? `<div class="sh-flag">${esc(r.provisional_note)}</div>` : ''}

            ${standing}

            ${(r.ideas || []).length ? `
                <div class="sh-ideas">
                    ${r.ideas.map((i, n) => `
                        <div class="card sh-idea">
                            <div class="sh-idea-top">
                                <span class="sh-idea-n">${n + 1}</span>
                                <div>
                                    <b>${esc(i.concept || i.hook || 'Post idea')}</b>
                                    <div class="sh-sub">${esc(i.format || '')}${i.when ? ' · ' + esc(i.when) : ''}${i.outlook ? ' · ' + esc(i.outlook) : ''}</div>
                                </div>
                            </div>
                            ${i.hook ? `<p class="sh-idea-hook">“${esc(i.hook)}”</p>` : ''}
                            ${i.script.length ? `<ol class="sh-script">${i.script.map(s => `<li>${esc(s)}</li>`).join('')}</ol>` : ''}
                            ${i.shot ? `<p class="sh-idea-meta"><b>On screen:</b> ${esc(i.shot)}</p>` : ''}
                            ${i.caption ? `<p class="sh-idea-meta"><b>Caption:</b> ${esc(i.caption)}</p>` : ''}
                            <p class="sh-idea-meta"><b>${esc(i.boost)}</b>${i.boost_why ? ' — ' + esc(i.boost_why) : ''}</p>
                        </div>`).join('')}
                </div>` : ''}

            ${(r.rooms || []).length ? `
                <div class="card sh-panel">
                    <h3>🏘 Where your customers are talking</h3>
                    <div class="sh-rooms">
                        ${r.rooms.map(g => `
                            <div class="sh-room">
                                <b>${esc(g.name)}</b>
                                <span>${g.members ? Number(g.members).toLocaleString() + ' members' : ''}${g.worth ? (g.members ? ' · ' : '') + esc(g.worth) : ''}</span>
                            </div>`).join('')}
                    </div>
                </div>` : ''}

            ${(r.working || []).length || (r.fix || []).length ? `
            <div class="sh-cols">
                <div class="card sh-panel"><h3>✅ What is working</h3>${points(r.working || [], 'good')}</div>
                <div class="card sh-panel"><h3>🔧 What to change</h3>${points(r.fix || [], 'todo')}</div>
            </div>` : ''}

            ${missing.length ? `
                <div class="card sh-panel">
                    <h3>📇 Missing from your profile</h3>
                    <p class="sh-sub">Someone who likes a post and visits your profile should never have
                       to search for how to reach you. These are quick to add.</p>
                    <ul class="sh-missing">${missing.map(m => `<li>${esc(m)}</li>`).join('')}</ul>
                </div>` : ''}

            ${r.summary ? `
                <div class="card sh-panel">
                    <h3>📝 In summary</h3>
                    <p style="font-size:0.9rem;line-height:1.65;color:var(--text-secondary);">${esc(r.summary)}</p>
                </div>` : ''}

            <div class="sh-foot">
                Prepared with EdgeLead${validUntil ? ` · this link works until ${esc(validUntil)}` : ''}<br>
                This page is read-only and is not listed anywhere — it only opens for someone with the link.
            </div>`;
    }
})();
</script>

</body>
</html>
