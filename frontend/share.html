<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://leadgen-backend-1-mgzc.onrender.com">
    <title>Your report — EdgeLead</title>
    <!-- Shared links are sent to clients, not indexed. -->
    <meta name="robots" content="noindex, nofollow">
    <link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wdth,wght@75..125,300..800&family=Anek+Bangla:wdth,wght@75..125,400..700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="app.css">
    <style>
    /* share.html — page-specific only. The report itself is rp-* in app.css. */
    .sh-wrap { max-width: 1040px; margin: 0 auto; }
    .sh-foot { margin-top: 34px; padding-top: 20px; border-top: 1px solid var(--card-border);
        font-size: 0.8rem; color: var(--text-muted); line-height: 1.6; text-align: center; }
    .sh-state { text-align: center; padding: 70px 24px; color: var(--text-muted); }
    .sh-state .el-svg { width: 34px; height: 34px; margin-bottom: 14px; color: var(--accent-solid); }
    .sh-state h2 { font-size: 1.15rem; font-weight: 700; color: var(--text-primary); margin-bottom: 10px; }
    .sh-state p { font-size: 0.9rem; line-height: 1.6; max-width: 420px; margin: 0 auto; }
    </style>
</head>
<body class="el-share">

<div class="el-page sh-wrap" id="sh-body">
    <div class="sh-state"><h2>Opening your report…</h2></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="header.js"></script>
<script src="report-view.js"></script>
<script>
(function () {
    'use strict';

    const $ = id => document.getElementById(id);
    let esc = v => String(v ?? '');

    document.addEventListener('DOMContentLoaded', async () => {
        // Share mode: EL.init needs no session, renders the read-only bar and
        // resolves immediately. This page is only ever reached by link.
        await EL.init({ page: 'share.html' });
        esc = EL.escape;

        if (!EL.isShared()) {
            return state('doc', 'Nothing to show',
                'This page opens a report someone shared with you. The link you followed has no report on it.');
        }

        try {
            const d = await EL.loadShared();
            render(d.report, d.client, d.shared);
        } catch (err) {
            // The three ways a link stops working each deserve their own words.
            const m = String(err.message || '');
            if (/expired/i.test(m))      return state('clock', 'This link has expired', 'Ask whoever sent it for a fresh one.');
            if (/turned off/i.test(m))   return state('shield', 'This link was turned off', 'Ask whoever sent it for a new one.');
            if (/not found|deleted/i.test(m)) return state('doc', 'Report not found', 'The report behind this link is no longer available.');
            state('alert', 'Could not open the report', m || 'Try again in a moment.');
        }
    });

    function state(icon, title, body) {
        $('sh-body').innerHTML = `<div class="sh-state">${EL.icon(icon)}<h2>${esc(title)}</h2><p>${esc(body)}</p></div>`;
    }

    /** The owner's view of the report, the same document their portal shows. */
    function render(r, client, shared) {
        if (!r) return state('doc', 'This report is empty', 'Nothing was saved for it.');
        const name = client && (client.brand || client.name);
        const validUntil = shared && shared.expiresAt ? new Date(shared.expiresAt).toLocaleDateString() : null;
        // A browser names a saved PDF after the title.
        document.title = `${name ? name + ' · ' : ''}${r.title || 'Report'}${r.month && r.month.cover.monthLabel ? ' · ' + r.month.cover.monthLabel : ''} — EdgeLead`;

        $('sh-body').innerHTML = ELReport.owner(r, {
            clientName: name,
            toolbar: `<button class="ws-btn is-sm" type="button" id="sh-pdf">${EL.icon('doc')}Save as PDF</button>`
        }) + `<div class="sh-foot">
                Prepared with EdgeLead${validUntil ? ` · this link works until ${esc(validUntil)}` : ''}<br>
                This page is read-only and is not listed anywhere — it only opens for someone with the link.
            </div>`;
        ELReport.hydrate($('sh-body'));
        $('sh-pdf').addEventListener('click', () => window.print());
    }
})();
</script>

</body>
</html>
