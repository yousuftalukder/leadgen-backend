<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://leadgen-backend-1-mgzc.onrender.com">
    <title>Edge Meta AI — EdgeLead</title>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wdth,wght@75..125,300..800&family=Anek+Bangla:wdth,wght@75..125,400..700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="app.css">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#06140f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="EdgeLead">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=2">
    <!--
        The XpulseAI Owner Assistant chat, inside EdgeLead (phase 31). The logic
        below is portal.js's chat, copied: the streamed answer, the figure
        panels drawn from the server's specs, follow-up chips, recent chats
        with rename and delete. The styling is EdgeLead's.
    -->
    <link rel="stylesheet" href="meta-ai.css">
</head>
<body class="el-has-header">

<div class="el-page">
    <div class="oa-wrap">
        <aside class="oa-side" id="oa-side">
            <button class="btn-secondary oa-new" id="oa-new" type="button">+ New chat</button>
            <h3 class="oa-side-h">Recent chats</h3>
            <div id="chat-history"></div>
        </aside>

        <main class="oa-main">
            <div class="oa-head">
                <button class="icon-btn oa-side-toggle" id="oa-side-toggle" type="button" aria-label="Recent chats">☰ Chats</button>
                <div class="oa-brand"><span>Edge Meta</span> <span class="oa-a">AI</span><span class="oa-by" id="oa-for"></span></div>
                <span class="oa-state" id="oa-state"></span>
            </div>
            <div id="chat-scroll" class="oa-scroll"><div id="chat-box" class="oa-box"></div></div>
            <button type="button" id="to-bottom" class="oa-to-bottom hidden" aria-label="Jump to the latest">↓</button>
            <form id="chat-form" class="oa-form">
                <div class="composer">
                    <textarea id="chat-input" rows="1" maxlength="2000" placeholder="Ask about your Instagram and Facebook…" aria-label="Your question"></textarea>
                    <button type="submit" id="send-btn" class="send-btn" aria-label="Send" disabled></button>
                </div>
                <p id="composer-hint" class="oa-hint">Answers come from your own Instagram and Facebook data. The most recent days can still change.</p>
            </form>
        </main>
    </div>
    <div id="conv-menu" role="menu" aria-label="Chat" class="oa-menu hidden">
        <button type="button" role="menuitem" data-action="conv-rename">Rename</button>
        <button type="button" role="menuitem" data-action="conv-delete" class="danger">Delete</button>
    </div>
</div>

    <script src="vendor/supabase-js-2.116.0.js"></script>
<script src="header.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script id="chartjs" src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js" defer></script>
<script src="meta-ai.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    const me = await EL.init({ engine: null, page: 'client-assistant.html' });
    MetaAI.start(me);
});
</script>
</body>
</html>
