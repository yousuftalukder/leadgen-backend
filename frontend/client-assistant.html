<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://leadgen-backend-1-mgzc.onrender.com">
    <title>Ask — EdgeLead</title>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wdth,wght@75..125,300..800&family=Anek+Bangla:wdth,wght@75..125,400..700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="app.css">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#06140f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="EdgeLead">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <style>
    /* client-assistant.html — page-specific only. Shared rules live in app.css. */

    .as-wrap { max-width: 820px; margin: 0 auto; }

    .as-thread { display: flex; flex-direction: column; gap: 16px; min-height: 240px; margin-bottom: 22px; }

    .as-turn { display: flex; gap: 12px; align-items: flex-start; }
    .as-turn.me { flex-direction: row-reverse; }
    .as-avatar { width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0; display: grid; place-items: center;
        font-size: 0.82rem; font-weight: 800; }
    .as-turn.ai .as-avatar { background: var(--accent-glow); color: #fff; }
    .as-turn.me .as-avatar { background: rgba(255,255,255,0.09); color: var(--text-muted); }

    .as-bubble { padding: 14px 17px; border-radius: 14px; font-size: 0.92rem; line-height: 1.65; max-width: 84%; }
    .as-turn.ai .as-bubble { background: var(--card-bg); border: 1px solid var(--card-border); border-top-left-radius: 4px; }
    .as-turn.me .as-bubble { background: rgba(12,120,86,0.16); border: 1px solid rgba(217,181,108,0.28);
        border-top-right-radius: 4px; }
    .as-bubble p { margin: 0 0 10px; }
    .as-bubble p:last-child { margin-bottom: 0; }

    .as-status { display: flex; align-items: center; gap: 9px; font-size: 0.84rem; color: var(--text-muted); }
    .as-dots { display: inline-flex; gap: 3px; }
    .as-dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent-solid);
        animation: as-pulse 1.2s infinite ease-in-out; }
    .as-dots i:nth-child(2) { animation-delay: .18s; }
    .as-dots i:nth-child(3) { animation-delay: .36s; }
    @keyframes as-pulse { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

    .as-ask { display: flex; gap: 10px; align-items: flex-end; }
    .as-ask textarea { flex: 1; resize: none; min-height: 52px; max-height: 160px; line-height: 1.5; }
    /* app.css gives .btn-primary width:100%, which here squeezes the textarea
       down to a sliver. Overridden rather than changed globally — every other
       page wants the full-width button. */
    .as-ask button { flex: 0 0 auto; width: auto; min-width: 104px; padding-left: 26px; padding-right: 26px; }

    .as-hint { font-size: 0.78rem; color: var(--text-muted); margin-top: 10px; line-height: 1.5; }

    /* Threads persist server-side, so losing them on reload was a bug in the
       page rather than a missing feature. Recent first, and only a handful —
       this is a way back to yesterday's question, not an archive. */
    .as-recent { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; align-items: center; }
    .as-recent-lab { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.06em;
        text-transform: uppercase; color: var(--text-muted); margin-right: 2px; }
    .as-thread-chip { font-size: 0.8rem; padding: 7px 13px; border-radius: 999px; cursor: pointer;
        max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        background: rgba(255,255,255,0.04); border: 1px solid var(--card-border);
        color: var(--text-secondary); transition: border-color .15s, color .15s; }
    .as-thread-chip:hover { border-color: var(--accent-solid); color: var(--text-primary); }

    .as-starters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .as-starter { font-size: 0.82rem; padding: 9px 14px; border-radius: 999px; cursor: pointer;
        background: rgba(255,255,255,0.045); border: 1px solid var(--card-border); color: var(--text-primary);
        transition: border-color .15s, background .15s; }
    .as-starter:hover { border-color: var(--accent-solid); background: rgba(12,120,86,0.1); }

    .as-intro { text-align: center; padding: 24px 0 8px; }
    .as-intro h2 { font-size: 1.35rem; font-weight: 800; margin-bottom: 9px; }
    .as-intro p { color: var(--text-muted); font-size: 0.9rem; line-height: 1.6; max-width: 480px; margin: 0 auto; }

    .as-connect { margin-bottom: 20px; padding: 14px 17px; border-radius: 11px; font-size: 0.85rem; line-height: 1.6;
        background: rgba(184,145,63,0.09); border: 1px solid rgba(184,145,63,0.26); color: #ddd6fe; }
    .as-connect b { color: #fff; }
    </style>
</head>
<body class="el-has-header">

<div class="el-page as-wrap">

    <div id="as-connect-note"></div>

    <div class="as-intro" id="as-intro">
        <h2>Ask about your business</h2>
        <p>Anything you want to know about how your social media is doing. I can only
           see your own data, so ask away.</p>
    </div>

    <div class="as-recent" id="as-recent"></div>

    <div class="as-starters" id="as-starters"></div>

    <div class="as-thread" id="as-thread"></div>

    <div class="as-ask">
        <textarea id="as-input" placeholder="How did we do last month?" rows="1"></textarea>
        <button class="btn-primary" id="as-send" type="button">Ask</button>
    </div>
    <p class="as-hint">Answers come from your own reports and, once Meta is connected, your own numbers,
       read every day. Nothing here is shared with anyone else.</p>

</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="header.js"></script>
<script>
(function () {
    'use strict';

    const $ = id => document.getElementById(id);
    let esc = v => String(v ?? '');
    let conversationId = null;
    let busy = false;

    const STARTERS_BASE = [
        'How am I doing?',
        'How do I compare to similar businesses?',
        'What should I post more of?',
        'When is the best time for me to post?'
    ];
    const STARTERS_META = ['Am I growing?', 'How many followers did I gain this week?',
        'What did my reach do last month?', 'Who is actually following me?'];

    document.addEventListener('DOMContentLoaded', async () => {
        const me = await EL.init({ engine: null, page: 'client-assistant.html' });
        esc = EL.escape;

        // Connected means a connection filed under this business — made by
        // the owner here or by their agency — not merely the engine grant a
        // trial holds. (phase 30)
        let connected = false, configured = true;
        try { const g = await EL.api('/api/client/growth'); connected = !!g.connected; configured = !!g.configured; }
        catch { /* the starters still work without it */ }
        renderStarters(connected);

        // The nudge is shown once, above the thread — not injected into every
        // answer. The assistant is told the same thing in its prompt.
        if (!connected && configured) {
            $('as-connect-note').innerHTML = `<div class="as-connect">
                Right now I can only see what is visible from outside your account.
                <b>Connect Meta</b> from <a href="client.html">My Reports</a> and I can also read your reach,
                profile visits and who your audience actually is — your own numbers, every day.</div>`;
        }

        loadThreads(me.business ? me.business.id : null);

        $('as-send').addEventListener('click', send);
        $('as-input').addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
        });
        $('as-input').addEventListener('input', autoGrow);
    });

    /** Recent threads, so a reload does not throw away yesterday's question. */
    async function loadThreads(businessId) {
        let list = [];
        try {
            // Threads are filed under the business (phase 30), so they are asked for by it.
            const r = await EL.api('/api/assistant/conversations' + (businessId ? '?client_id=' + encodeURIComponent(businessId) : ''));
            list = (r.conversations || []).slice(0, 5);
        } catch { return; }                       // never block the ask box on this
        if (!list.length) return;

        $('as-recent').innerHTML = `<span class="as-recent-lab">Earlier</span>` +
            list.map(c => `<button class="as-thread-chip" type="button" data-id="${esc(c.id)}"
                >${esc(c.title || 'Conversation')}</button>`).join('');

        $('as-recent').querySelectorAll('.as-thread-chip').forEach(b =>
            b.addEventListener('click', () => openThread(b.dataset.id)));
    }

    async function openThread(id) {
        if (busy) return;
        busy = true;
        try {
            const { messages } = await EL.api('/api/assistant/conversation/' + encodeURIComponent(id));
            conversationId = id;
            $('as-intro').style.display = 'none';
            $('as-starters').style.display = 'none';
            $('as-recent').style.display = 'none';
            $('as-thread').innerHTML = '';
            (messages || []).forEach(m => turn(m.role === 'user' ? 'me' : 'ai', paragraphs(m.content)));
        } catch (err) {
            if (!err.handled) turn('ai', paragraphs(err.message || 'Could not open that conversation.'));
        } finally { busy = false; }
    }

    function autoGrow() {
        const t = $('as-input');
        t.style.height = 'auto';
        t.style.height = Math.min(t.scrollHeight, 160) + 'px';
    }

    function renderStarters(connected) {
        const list = connected ? STARTERS_BASE.concat(STARTERS_META) : STARTERS_BASE;
        $('as-starters').innerHTML = list
            .map(s => `<button class="as-starter" type="button">${esc(s)}</button>`).join('');
        $('as-starters').querySelectorAll('.as-starter').forEach(b =>
            b.addEventListener('click', () => { $('as-input').value = b.textContent; send(); }));
    }

    function turn(role, html) {
        const el = document.createElement('div');
        el.className = 'as-turn ' + (role === 'me' ? 'me' : 'ai');
        el.innerHTML = `<div class="as-avatar">${role === 'me' ? 'You' : '⚡'}</div>
                        <div class="as-bubble">${html}</div>`;
        $('as-thread').appendChild(el);
        el.scrollIntoView({ behavior: 'smooth', block: 'end' });
        return el;
    }

    /** Paragraphs only — the model is told to write prose, and anything that
     *  arrives is escaped before it is ever put in the DOM. */
    function paragraphs(text) {
        return String(text || '').split(/\n{2,}/).map(p =>
            `<p>${esc(p.trim()).replace(/\n/g, '<br>')}</p>`).join('');
    }

    async function send() {
        if (busy) return;
        const input = $('as-input');
        const message = input.value.trim();
        if (!message) return;

        $('as-intro').style.display = 'none';
        $('as-starters').style.display = 'none';
        $('as-recent').style.display = 'none';

        busy = true;
        $('as-send').disabled = true;
        input.value = ''; autoGrow();

        turn('me', paragraphs(message));
        const thinking = turn('ai',
            `<div class="as-status"><span class="as-dots"><i></i><i></i><i></i></span>
             <span id="as-status-label">Thinking</span></div>`);

        try {
            await stream(message, label => {
                const el = document.getElementById('as-status-label');
                if (el) el.textContent = label;
            }, out => {
                thinking.querySelector('.as-bubble').innerHTML = paragraphs(out.answer);
                conversationId = out.conversationId || conversationId;
            });
        } catch (err) {
            if (err.handled) { thinking.remove(); return; }
            thinking.querySelector('.as-bubble').innerHTML = paragraphs(
                err.message || 'Something went wrong answering that. Try again in a moment.');
        } finally {
            busy = false;
            $('as-send').disabled = false;
            input.focus();
        }
    }

    /**
     * Server-sent events over a POST, so it is read from the fetch body rather
     * than with EventSource — EventSource cannot POST or carry a bearer token.
     * The stream carries status, not tokens; the answer arrives in one piece.
     */
    async function stream(message, onStatus, onDone) {
        const res = await fetch(EL.backendUrl() + '/api/assistant/ask?stream=1', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + await EL.token()
            },
            body: JSON.stringify({ message, conversationId })
        });

        if (!res.ok) {
            let data = null;
            try { data = await res.json(); } catch { /* empty body */ }
            if (res.status === 401) { EL.signOut(); return; }
            const err = new Error((data && data.error) || `Request failed (${res.status})`);
            err.status = res.status;
            throw err;
        }

        const reader  = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        for (;;) {
            const { value, done } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });

            // Frames are separated by a blank line; a partial tail stays in the
            // buffer until the rest of it arrives.
            const frames = buffer.split('\n\n');
            buffer = frames.pop();

            for (const frame of frames) {
                if (!frame.trim() || frame.startsWith(':')) continue;   // keepalive
                let event = 'message', payload = '';
                for (const line of frame.split('\n')) {
                    if (line.startsWith('event:')) event = line.slice(6).trim();
                    else if (line.startsWith('data:')) payload += line.slice(5).trim();
                }
                if (!payload) continue;

                let data;
                try { data = JSON.parse(payload); } catch { continue; }

                if (event === 'status' && data.label) onStatus(data.label);
                else if (event === 'done')  onDone(data);
                else if (event === 'error') throw new Error(data.error || 'That did not work.');
            }
        }
    }
})();
</script>

</body>
</html>
