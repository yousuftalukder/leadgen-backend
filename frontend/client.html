<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://leadgen-backend-1-mgzc.onrender.com">
    <title>Home — EdgeLead</title>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wdth,wght@75..125,300..800&family=Anek+Bangla:wdth,wght@75..125,400..700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="app.css">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#06140f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="EdgeLead">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <style>
    /* client.html — page-specific only. Shared rules live in app.css. */

    /* minmax(0, …): a bare 1fr grows to the widest table in the report and
       pushes the page sideways on a phone. */
    .cl-wrap { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 26px; align-items: start; }
    @media (max-width: 940px) { .cl-wrap { grid-template-columns: minmax(0, 1fr); } }

    /* ---- report list ---- */
    .cl-list { display: grid; gap: 10px; }
    /* A button does not inherit colour or font; without these the report
       names were near-black on the dark card. */
    .cl-item { text-align: left; width: 100%; cursor: pointer; padding: 15px 16px; border-radius: 12px; color: var(--text-primary); font: inherit;
        background: var(--card-bg); border: 1px solid var(--card-border); transition: border-color .15s, transform .15s; }
    .cl-item:hover { border-color: rgba(217,181,108,0.45); transform: translateX(2px); }
    .cl-item.is-active { border-color: var(--accent-solid); background: rgba(12,120,86,0.09); }
    .cl-item h4 { font-size: 0.92rem; font-weight: 700; margin-bottom: 4px; }
    .cl-item .cl-meta { font-size: 0.76rem; color: var(--text-muted); display: flex; gap: 8px; align-items: center; }

    .cl-band { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.68rem;
        font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; }
    .cl-band.strong  { background: rgba(16,185,129,0.16); color: #6ee7b7; }
    .cl-band.healthy { background: rgba(12,120,86,0.16); color: #f0d39a; }
    .cl-band.mixed   { background: rgba(245,158,11,0.16); color: #fcd34d; }
    .cl-band.weak,
    .cl-band.poor    { background: rgba(239,68,68,0.16);  color: #fca5a5; }

    /* ---- the report itself is rp-* in app.css (phase 34) ---- */

    /* ---- to-dos and the agency's work (phase 34) ---- */
    .cl-indent { padding-left: 28px; }
    .cl-late { color: var(--danger); font-weight: 700; }
    .cl-tasks { margin-bottom: 22px; }
    .cl-tasks .ws-check { padding: 2px 0; }
    .cl-tasks .ws-check .ws-t { font-size: 0.92rem; }
    @media print { .cl-wrap { display: block; } }

    /* ---- run a new check-up ---- */
    .cl-run { max-width: 620px; }
    .cl-run h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 8px; }
    .cl-run .cl-sub { margin-bottom: 20px; line-height: 1.6; }
    .cl-run label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--text-muted);
        text-transform: uppercase; letter-spacing: 0.04em; margin: 16px 0 7px; }
    .cl-run label:first-of-type { margin-top: 0; }
    .cl-rivals { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 560px) { .cl-rivals { grid-template-columns: 1fr; } }
    .cl-tip { font-size: 0.8rem; color: var(--text-muted); margin-top: 8px; line-height: 1.5; }
    .cl-run-err { margin-top: 14px; font-size: 0.86rem; color: var(--danger); line-height: 1.5; min-height: 18px; }
    .cl-run-err.is-quota { color: #fcd34d; }
    .cl-progress { margin-top: 18px; }
    .cl-progress .cl-track { height: 6px; border-radius: 999px; background: rgba(255,255,255,0.09); overflow: hidden; }
    .cl-progress .cl-track i { display: block; height: 100%; width: 0; background: var(--accent-glow); transition: width .3s; }
    .cl-progress .cl-step { font-size: 0.84rem; color: var(--text-muted); margin-top: 9px; }

    .cl-new { width: 100%; margin-bottom: 14px; }

    .cl-empty { text-align: center; padding: 60px 24px; color: var(--text-muted); }
    .cl-empty h3 { font-size: 1.1rem; font-weight: 700; color: var(--text-primary); margin-bottom: 10px; }
    .cl-empty p { font-size: 0.9rem; line-height: 1.6; max-width: 420px; margin: 0 auto 8px; }

    /* ---- the numbers every day (phase 30) ----
       Four single values wear stat tiles; the day-by-day run is a table, not
       a chart — fourteen rows read faster on a phone than a sparkline nobody
       can hover, and a table never hides a gap. Direction is an arrow and a
       word, never colour alone. */
    .cl-growth { margin-bottom: 22px; }
    .cl-gtop { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .cl-gtop h3 { font-size: 1.05rem; font-weight: 800; margin: 0; }
    .cl-gsub { font-size: 0.78rem; color: var(--text-muted); }
    .cl-gsync { margin-left: auto; }
    .cl-gtiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
    .cl-gtile { padding: 14px 16px; border-radius: var(--r-md, 12px); background: rgba(255,255,255,0.035);
        border: 1px solid var(--card-border); }
    .cl-gtile .k { font-size: 0.68rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); }
    .cl-gtile .v { font-size: 1.55rem; font-weight: 800; margin-top: 4px; letter-spacing: -0.02em; }
    .cl-gtile .s { font-size: 0.76rem; color: var(--text-secondary); margin-top: 3px; line-height: 1.45; }
    .cl-gtile .s.up { color: #6ee7b7; }
    .cl-gtile .s.down { color: #fdba74; }
    .cl-gtable { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin-top: 16px; }
    .cl-gtable th { text-align: left; font-size: 0.64rem; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase;
        color: var(--text-muted); padding: 0 8px 8px 0; border-bottom: 1px solid var(--card-border); white-space: nowrap; }
    .cl-gtable td { padding: 7px 8px 7px 0; border-bottom: 1px solid rgba(240,211,154,0.05); }
    .cl-gtable th.num, .cl-gtable td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .cl-gfoot { font-size: 0.76rem; color: var(--text-muted); margin-top: 12px; line-height: 1.55; }
    .cl-gconnect { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
    .cl-gconnect p { font-size: 0.88rem; line-height: 1.6; color: var(--text-secondary); flex: 1 1 320px; margin: 0; }
    .cl-gconnect p b { color: var(--text-primary); }
    @media (max-width: 560px) { .cl-gtable .col-x, .cl-gtable th.col-x { display: none; } }
    </style>
</head>
<body class="el-has-header">

<div class="el-page">
    <div class="ws-head no-print"><div><h1 id="cl-hello">Welcome</h1><p class="ws-sub" id="cl-sub"></p></div></div>
    <!-- The numbers every day: shown once Meta is connected, offered until then. -->
    <section id="cl-growth" class="cl-growth no-print" hidden></section>
    <!-- What is waiting on the owner, and what the agency is doing for them. -->
    <div id="cl-tasks" class="ws-grid g2e cl-tasks no-print" hidden></div>
    <!-- The planned posts waiting for the owner's OK (phase 42). -->
    <section id="cl-content" class="ws-card cp-own no-print" hidden></section>
    <div class="cl-wrap">

        <aside class="no-print">
            <button class="btn-primary cl-new" id="cl-new" type="button">+ New check-up</button>
            <h3 style="font-size:0.78rem;font-weight:800;color:var(--text-muted);text-transform:uppercase;
                       letter-spacing:0.05em;margin-bottom:12px;">Your reports</h3>
            <div class="cl-list" id="cl-list">
                <div style="color:var(--text-muted);font-size:0.85rem;">Loading…</div>
            </div>
        </aside>

        <main id="cl-body">
            <div class="cl-empty"><h3>Loading your report…</h3></div>
        </main>

    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="header.js"></script>
<script src="report-view.js"></script>
<script>
(function () {
    'use strict';

    const $ = id => document.getElementById(id);
    let esc = v => String(v ?? '');
    let reports = [];
    let activeId = null;
    let canRun = false;

    document.addEventListener('DOMContentLoaded', async () => {
        // engine: null — this page is the client's home and is not gated on any
        // single tool grant. EL.init still enforces the session and the account
        // state, and a lapsed account never gets this far.
        const me = await EL.init({ engine: null, page: 'client.html' });
        esc = EL.escape;

        try {
            const r = await EL.api('/api/client/reports');
            reports = r.reports || [];
        } catch (err) {
            if (err.handled) return;               // 402 already showed its own screen
            return showEmpty('Could not load your reports', err.message);
        }

        canRun = (me.engines || []).includes('report');
        $('cl-new').style.display = canRun ? '' : 'none';
        $('cl-new').addEventListener('click', () => showRunForm(false));
        greet(me);
        loadGrowth(me);
        loadTasks();
        loadContent();

        renderList();
        if (reports.length) open(reports[0].id);
        // An empty dashboard with no way to fill it is a dead end — a new
        // account lands straight on the form rather than on "nothing here yet".
        else if (canRun) showRunForm(true);
        else showEmpty('No reports yet',
            'Once a report has been run for your business it will appear here.');
    });

    // ---- the greeting --------------------------------------------------------
    function greet(me) {
        const h = new Date().getHours();
        const first = String((me && me.full_name) || '').trim().split(/\s+/)[0];
        $('cl-hello').textContent = `${h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'}${first ? ', ' + first : ''}`;
        const biz = me && me.business && me.business.name;
        $('cl-sub').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }) + (biz ? ' · ' + biz : '');
    }

    // ---- to-dos, and the agency's work (phase 34) ------------------------------
    // The same tasks the agency's board holds, the ones marked for the owner:
    // their own to-dos, which they tick off here, and the work being done for
    // them, which they can see but not change.
    const TASK_STATE = { todo: 'Planned', doing: 'In progress', waiting: 'Waiting on you', done: 'Done' };
    const todayIso = () => new Date().toISOString().slice(0, 10);
    const shortDay = iso => new Date(String(iso).slice(0, 10) + 'T00:00:00Z').toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });

    async function loadTasks() {
        const host = $('cl-tasks');
        let d;
        try { d = await EL.api('/api/client/tasks'); } catch { return; }
        const tasks = d.tasks || [];
        if (!tasks.length) { host.hidden = true; return; }
        const recent = t => t.status === 'done' && t.completedAt && Date.now() - Date.parse(t.completedAt) < 30 * 86400000;
        const mine = tasks.filter(t => t.yours && (t.status !== 'done' || recent(t)));
        const ours = tasks.filter(t => !t.yours && t.status !== 'done');
        const finished = tasks.filter(t => !t.yours && recent(t));
        const meta = t => {
            const bits = [];
            if (t.dueDate) bits.push(t.status !== 'done' && t.dueDate < todayIso() ? `<span class="cl-late">overdue since ${esc(shortDay(t.dueDate))}</span>` : `due ${esc(shortDay(t.dueDate))}`);
            if (t.from) bits.push('from ' + esc(t.from));
            return bits.join(' · ');
        };
        host.hidden = false;
        host.innerHTML = `
            <section class="ws-card"><div class="ws-card-h"><h2>Your to-dos</h2><span class="el-muted ws-num">${mine.filter(t => t.status !== 'done').length} open</span></div>
                ${mine.length ? `<div class="ws-rows">${mine.map(t => `<div class="ws-row"><div class="ws-grow">
                    <button class="ws-check" type="button" role="checkbox" aria-checked="${t.status === 'done'}" data-tick="${esc(t.id)}"><span class="box">${EL.icon('check')}</span><span class="ws-t">${esc(t.title)}</span></button>
                    ${meta(t) ? `<div class="ws-m cl-indent">${meta(t)}</div>` : ''}
                    ${t.notes ? `<div class="ws-m cl-indent">${esc(t.notes.slice(0, 400))}</div>` : ''}</div></div>`).join('')}</div>`
                : '<p class="el-muted">Nothing is waiting on you. When your agency needs something from you, it shows up here.</p>'}
            </section>
            <section class="ws-card"><div class="ws-card-h"><h2>What we are working on</h2><span class="el-muted ws-num">${ours.length} open</span></div>
                ${ours.length ? `<div class="ws-rows">${ours.map(t => `<div class="ws-row"><span class="ws-sev ${t.status === 'doing' ? 'is-gold' : t.status === 'waiting' ? 'is-warn' : ''}"></span>
                    <div class="ws-grow"><div class="ws-t">${esc(t.title)}</div><div class="ws-m">${[esc(TASK_STATE[t.status] || t.status), meta(t)].filter(Boolean).join(' · ')}</div></div></div>`).join('')}</div>`
                : '<p class="el-muted">Nothing open right now.</p>'}
                ${finished.length ? `<p class="el-muted">Finished in the last 30 days: ${finished.slice(0, 4).map(t => esc(t.title)).join('; ')}${finished.length > 4 ? ` and ${finished.length - 4} more` : ''}.</p>` : ''}
            </section>`;
        host.querySelectorAll('[data-tick]').forEach(b => b.addEventListener('click', async () => {
            const t = tasks.find(x => x.id === b.dataset.tick);
            if (!t) return;
            const next = t.status === 'done' ? 'todo' : 'done';
            b.disabled = true;
            try {
                await EL.api(`/api/client/tasks/${encodeURIComponent(t.id)}`, { method: 'PATCH', body: { status: next } });
                EL.toast(next === 'done' ? 'Done. Your agency sees it on their board.' : 'Marked as not done.');
                loadTasks();
            } catch (err) { b.disabled = false; if (!err.handled) EL.toast(err.message, 'bad'); }
        }));
    }

    // ---- planned posts to approve (phase 42) ---------------------------------
    async function loadContent() {
        const host = $('cl-content');
        let d;
        try { d = await EL.api('/api/client/content'); } catch { return; }
        const posts = d.posts || [];
        if (!posts.length) { host.hidden = true; return; }
        const waiting = posts.filter(p => p.status === 'idea');
        const card = p => `<article class="cp-card is-${esc(p.status)}" data-post="${esc(p.id)}">
            <div class="cp-top"><span class="cp-date">${esc(shortDay(p.plannedOn))}${p.time ? ' · ' + esc(p.time) : ''}</span>
                ${p.format ? `<span class="cp-fmt">${esc(p.format)}</span>` : ''}<span class="cp-st">${esc(p.statusName)}</span></div>
            <h3 class="cp-hook">${esc(p.hook || 'Planned post')}</h3>
            ${p.shot ? `<p class="cp-line"><b>What it shows:</b> ${esc(p.shot)}</p>` : ''}
            ${p.caption ? `<details class="cp-cap"><summary>Read the caption</summary><p>${esc(p.caption)}</p></details>` : ''}
            ${p.yourNote ? `<p class="cp-line"><b>You said:</b> ${esc(p.yourNote)}</p>` : ''}
            ${p.postedUrl ? `<a class="cp-link" href="${EL.safeUrl(p.postedUrl)}" target="_blank" rel="noopener noreferrer">See the post</a>` : ''}
            ${['idea', 'changes', 'approved'].includes(p.status) ? `<div class="cp-acts">
                ${p.status !== 'approved' ? `<button class="ws-btn is-gold is-sm" type="button" data-do="approve">Approve</button>` : ''}
                <button class="ws-btn is-sm" type="button" data-do="changes">${p.status === 'changes' ? 'Change my note' : 'Ask for changes'}</button>
                ${p.status !== 'approved' ? `<button class="ws-btn is-quiet is-sm" type="button" data-do="skip">Skip this one</button>` : ''}
            </div>
            <form class="cp-change" hidden><textarea rows="2" maxlength="2000" aria-label="What would you like changed?" placeholder="What would you like changed?">${esc(p.yourNote || '')}</textarea>
                <button class="ws-btn is-sm" type="submit">Send</button></form>` : ''}
        </article>`;
        host.hidden = false;
        host.innerHTML = `<div class="ws-card-h"><h2>Posts planned for you</h2><span class="el-muted ws-num">${waiting.length ? waiting.length + ' waiting for your OK' : 'all decided'}</span></div>
            <p class="el-muted">Your agency made these for the coming weeks. Approve the ones you like; they go straight onto the team’s list to make.</p>
            <div class="cp-list">${posts.map(card).join('')}</div>`;
        const decide = async (id, decision, note) => {
            try {
                await EL.api(`/api/client/content/${encodeURIComponent(id)}/decision`, { method: 'POST', body: { decision, note } });
                EL.toast(decision === 'approve' ? 'Approved. Your agency will make it.' : decision === 'skip' ? 'Skipped.' : 'Sent to your agency.');
                loadContent();
            } catch (err) { if (!err.handled) EL.toast(err.message, 'bad'); }
        };
        host.querySelectorAll('[data-post]').forEach(c => {
            c.querySelectorAll('[data-do]').forEach(b => b.addEventListener('click', () => {
                if (b.dataset.do === 'changes') { const f = c.querySelector('.cp-change'); f.hidden = !f.hidden; if (!f.hidden) f.querySelector('textarea').focus(); return; }
                b.disabled = true; decide(c.dataset.post, b.dataset.do);
            }));
            const f = c.querySelector('.cp-change');
            if (f) f.addEventListener('submit', e => {
                e.preventDefault();
                const v = f.querySelector('textarea').value.trim();
                if (!v) { f.querySelector('textarea').focus(); return; }
                decide(c.dataset.post, 'changes', v);
            });
        });
    }

    // ---- the numbers every day (phase 30) ---------------------------------

    /** Today's numbers and how they moved — the owner-side read, every day. */
    async function loadGrowth(me) {
        const host = $('cl-growth');
        let g;
        try { g = await EL.api('/api/client/growth'); } catch { return; }
        if (!g.configured && !g.connected) return;      // no Meta app on this server: say nothing
        host.hidden = false;
        if (!g.connected) {
            const canConnect = (me.engines || []).includes('meta_owned') && g.configured;
            host.innerHTML = `<div class="card"><div class="cl-gconnect">
                <p><b>See your growth every day.</b> Connect your Facebook Page and Instagram and EdgeLead reads your
                   numbers daily — followers, reach, profile visits — so you can see what moved, not just what a
                   report said. The assistant reads the same numbers.</p>
                ${canConnect ? `<button class="btn-primary" type="button" id="cl-gconnect">Connect Meta</button>` : ''}
            </div></div>`;
            const b = $('cl-gconnect');
            if (b) b.addEventListener('click', async () => {
                b.disabled = true;
                try { const d = await EL.api('/api/meta/oauth/start'); window.location.href = d.url; }
                catch (err) { b.disabled = false; if (!err.handled) alert(err.message); }
            });
            return;
        }
        renderGrowth(g);
    }

    const gnum = v => (v === null || v === undefined ? '—' : Number(v).toLocaleString());
    const gsigned = v => (v === null || v === undefined ? null : (v > 0 ? '+' : '') + Number(v).toLocaleString());
    const gword = k => ({ up: '↑ up', down: '↓ down', flat: '→ flat', new: '↑ new' }[k] || '');
    const gpct = p => (p === null || p === undefined ? '' : ` (${p > 0 ? '+' : ''}${p}%)`);

    function renderGrowth(g) {
        const host = $('cl-growth');
        const gr = g.growth || {};
        const c = g.connection || {};
        const name = c.ig_username ? '@' + c.ig_username : (c.page_name || 'your account');
        const syncedAt = c.daily_synced_at ? new Date(c.daily_synced_at) : null;
        const syncBtn = `<button class="btn-secondary btn-mini cl-gsync" type="button" id="cl-gsync">Sync now</button>`;
        const lastTry = c.daily_error ? ` Last try did not finish: ${esc(c.daily_error)}` : '';

        if (gr.empty) {
            host.innerHTML = `<div class="card"><div class="cl-gtop"><h3>Your numbers, every day</h3>
                <span class="cl-gsub">${esc(name)} is connected. The first numbers arrive within the hour.${lastTry}</span>${syncBtn}</div></div>`;
            wireSync();
            return;
        }

        const f = gr.followers || {};
        const noWeek = f.week === null || f.week === undefined;
        const weekLine = noWeek
            ? (f.day === null || f.day === undefined ? 'first day of numbers — growth shows from tomorrow' : `${gsigned(f.day)} since yesterday · a week of days needed for more`)
            : `${gsigned(f.week)} this week${gpct(f.week_pct)}${f.day !== null && f.day !== undefined ? ` · ${gsigned(f.day)} since yesterday` : ''}`;
        const weekKind = noWeek ? '' : (f.week > 0 ? 'up' : (f.week < 0 ? 'down' : ''));

        const winTile = (label, w) => {
            const x = w || {};
            const none = x.now === null || x.now === undefined;
            const sub = none
                ? 'no complete days yet'
                : (x.before === null || x.before === undefined
                    ? 'last 7 days · nothing yet to compare with'
                    : `${gword(x.kind)} vs ${gnum(x.before)} the week before${gpct(x.pct)}`);
            const cls = none ? '' : (x.kind === 'up' || x.kind === 'new' ? 'up' : (x.kind === 'down' ? 'down' : ''));
            return `<div class="cl-gtile"><div class="k">${label}</div><div class="v">${gnum(x.now)}</div><div class="s ${cls}">${sub}</div></div>`;
        };

        const rows = (gr.series || []).slice(-14).reverse();
        host.innerHTML = `<div class="card">
            <div class="cl-gtop"><h3>Your numbers, every day</h3>
                <span class="cl-gsub">${esc(name)} · since ${esc(gr.since || '')} · ${gr.days} day${gr.days === 1 ? '' : 's'}</span>${syncBtn}</div>
            <div class="cl-gtiles">
                <div class="cl-gtile"><div class="k">Followers</div><div class="v">${gnum(f.now)}</div><div class="s ${weekKind}">${weekLine}</div></div>
                ${winTile('Reach, last 7 days', gr.reach)}
                ${winTile('Profile visits, last 7 days', gr.profile_views)}
                ${winTile('Interactions, last 7 days', gr.interactions)}
            </div>
            <table class="cl-gtable">
                <thead><tr><th>Day</th><th class="num">Followers</th><th class="num">Reach</th><th class="num col-x">Profile visits</th><th class="num col-x">Interactions</th></tr></thead>
                <tbody>${rows.map(r => `<tr><td>${esc(r.day)}</td><td class="num">${gnum(r.followers)}</td><td class="num">${gnum(r.reach)}</td>
                    <td class="num col-x">${gnum(r.profile_views)}</td><td class="num col-x">${gnum(r.interactions)}</td></tr>`).join('')}</tbody>
            </table>
            <p class="cl-gfoot">Read from your own Meta account${syncedAt ? ', last at ' + esc(syncedAt.toLocaleString()) : ''}. A day's reach, visits and
               interactions are written the day after, once the day is complete; followers are the count on that day.${lastTry}</p>
        </div>`;
        wireSync();
    }

    function wireSync() {
        const b = $('cl-gsync');
        if (!b) return;
        b.addEventListener('click', async () => {
            b.disabled = true; b.textContent = 'Reading…';
            try { renderGrowth(await EL.api('/api/meta/daily-sync', { method: 'POST', body: {} })); }
            catch (err) { b.disabled = false; b.textContent = 'Sync now'; if (!err.handled) alert(err.message); }
        });
    }

    function showRunForm(firstRun) {
        activeId = null;
        renderList();
        $('cl-body').innerHTML = `
            <div class="card cl-run">
                <h2>${firstRun ? 'Let us look at your Instagram' : 'Run a new check-up'}</h2>
                <p class="cl-sub">${firstRun
                    ? 'One check-up tells you how your account is doing and how you compare to similar businesses. It takes a couple of minutes.'
                    : 'Enter the account to look at. Adding similar businesses is what makes the comparison possible.'}</p>

                <label for="rn-handle">Your Instagram handle</label>
                <input type="text" id="rn-handle" placeholder="harborcafe" autocomplete="off" spellcheck="false">

                <label for="rn-r1">Two businesses like yours
                    <span style="text-transform:none;font-weight:500;letter-spacing:0;">— optional</span></label>
                <div class="cl-rivals">
                    <input type="text" id="rn-r1" placeholder="a competitor" autocomplete="off" spellcheck="false">
                    <input type="text" id="rn-r2" placeholder="another one" autocomplete="off" spellcheck="false">
                </div>
                <p class="cl-tip">Pick businesses about your size, ideally near you. Leave these blank
                   and you still get your own report — just without anything to compare it against.</p>

                <button class="btn-primary" id="rn-go" type="button" style="margin-top:20px;">Run my check-up</button>
                <div class="cl-run-err" id="rn-err"></div>
                <div class="cl-progress" id="rn-prog" style="display:none;">
                    <div class="cl-track"><i></i></div>
                    <div class="cl-step">Starting…</div>
                </div>
            </div>`;

        $('rn-go').addEventListener('click', runCheckup);
        ['rn-handle', 'rn-r1', 'rn-r2'].forEach(id =>
            $(id).addEventListener('keydown', e => { if (e.key === 'Enter') runCheckup(); }));
    }

    async function runCheckup() {
        const clean  = v => String(v || '').replace('@', '').replace(/\/+$/, '').trim().toLowerCase();
        const target = clean($('rn-handle').value);
        const r1 = clean($('rn-r1').value);
        const r2 = clean($('rn-r2').value);

        const err = $('rn-err');
        err.textContent = ''; err.className = 'cl-run-err';
        if (!target) { err.textContent = 'Enter your Instagram handle to get started.'; return; }

        const btn  = $('rn-go');
        const prog = $('rn-prog');
        const stop = () => { btn.disabled = false; btn.textContent = 'Run my check-up'; prog.style.display = 'none'; };
        const step = (pct, msg) => {
            prog.querySelector('i').style.width = (pct || 0) + '%';
            prog.querySelector('.cl-step').textContent = msg || '';
        };

        btn.disabled = true; btn.textContent = 'Running…';
        prog.style.display = ''; step(2, 'Starting…');

        try {
            await EL.runJob('/api/generate-ig-report',
                { target, compareRivals: !!(r1 || r2), rival1: r1 || null, rival2: r2 || null },
                {
                    onProgress: j => step(j.progress, j.current_step),
                    onFailed: j => { stop(); err.textContent = j.error || 'That check-up did not finish.'; },
                    onDone: async j => {
                        step(100, 'Done — opening your report');
                        const id = j.result && (j.result.reportId || j.result.reportRef);
                        try {
                            const r = await EL.api('/api/client/reports');
                            reports = r.reports || [];
                        } catch { /* the report itself still opens below */ }
                        renderList();
                        if (id) open(id);
                        else if (reports.length) open(reports[0].id);
                        else stop();
                    }
                });
        } catch (e) {
            stop();
            if (e.handled) return;              // lapsed account already has its screen
            err.textContent = e.message;
            // Hitting an allowance is amber, not red — the account is fine,
            // this one run is not available.
            if (e.quota) err.className = 'cl-run-err is-quota';
        }
    }

    function renderList() {
        if (!reports.length) { $('cl-list').innerHTML =
            '<div style="color:var(--text-muted);font-size:0.85rem;">Nothing here yet.</div>'; return; }

        $('cl-list').innerHTML = reports.map(r => `
            <button class="cl-item ${r.id === activeId ? 'is-active' : ''}" data-id="${esc(r.id)}">
                <h4>${esc(r.title)}${r.handle ? ' · @' + esc(r.handle) : ''}</h4>
                <div class="cl-meta">
                    <span>${esc(r.date || '')}</span>
                    ${r.band ? `<span class="cl-band ${esc(r.band)}">${esc(r.band)}</span>` : ''}
                </div>
            </button>`).join('');

        $('cl-list').querySelectorAll('.cl-item').forEach(el => {
            el.addEventListener('click', () => open(el.dataset.id));
        });
    }

    async function open(id) {
        activeId = id;
        renderList();
        $('cl-body').innerHTML = '<div class="cl-empty"><h3>Opening…</h3></div>';
        try {
            const { report } = await EL.api('/api/client/report/' + encodeURIComponent(id));
            render(report);
        } catch (err) {
            if (err.handled) return;
            showEmpty('Could not open that report', err.message);
        }
    }

    function render(r) {
        if (!r) return showEmpty('That report is empty', 'Nothing was saved for it.');
        // The same document the agency sends and a share link shows (phase 34).
        $('cl-body').innerHTML = ELReport.owner(r, {
            toolbar: `<button class="ws-btn is-sm" type="button" id="cl-pdf">${EL.icon('doc')}Save as PDF</button>`
        });
        ELReport.hydrate($('cl-body'));
        $('cl-pdf').addEventListener('click', () => window.print());
    }

    function showEmpty(title, body) {
        $('cl-body').innerHTML = `
            <div class="cl-empty">
                <h3>${esc(title)}</h3>
                <p>${esc(body || '')}</p>
            </div>`;
    }
})();
</script>

</body>
</html>
