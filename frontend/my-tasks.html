<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://leadgen-backend-1-mgzc.onrender.com">
<title>My tasks — EdgeLead</title>
<link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wdth,wght@75..125,300..800&family=Anek+Bangla:wdth,wght@75..125,400..700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main class="el-page" id="mt"><div class="ws-empty"><p>Loading your tasks…</p></div></main>

    <script src="vendor/supabase-js-2.116.0.js"></script>
<script src="header.js"></script>
<script src="ui.js"></script>
<script>
(async () => {
    'use strict';
    // Everything assigned to you, on every client you can open. Each task
    // still lives on its client's board; this is the same card, gathered.
    await EL.init({ engine: null, page: 'my-tasks.html' });
    const esc = v => EL.esc(v);
    const root = document.getElementById('mt');
    const boards = new Map();       // clientId -> the board payload, for people and edit rights
    // Phase 59: filter by label (Website, Content…). Kept in the address, so a link opens filtered.
    let label = new URLSearchParams(location.search).get('label') || '';
    let all = [];
    const setLabel = l => {
        label = l;
        const u = new URL(location.href);
        if (l) u.searchParams.set('label', l); else u.searchParams.delete('label');
        history.replaceState(null, '', u);
        draw();
    };

    async function load() {
        let d;
        try { d = await EL.api('/api/my-tasks'); }
        catch (err) {
            root.innerHTML = `<div class="ws-head"><div><h1>My tasks</h1></div></div><div class="ws-empty">${EL.icon('alert')}<h3>${err.code === 'migration_required' ? 'Tasks are not switched on yet' : 'Your tasks could not be loaded'}</h3><p>${esc(err.message)}</p></div>`;
            return;
        }
        all = d.tasks || [];
        draw();
    }

    function draw() {
        const tasks = all.filter(t => UI.hasLabel(t, label));
        const week = new Date(Date.now() + 7 * 86400000).toISOString().slice(0, 10);
        const groups = [
            ['Overdue', tasks.filter(UI.isLate)],
            ['This week', tasks.filter(t => t.status !== 'done' && !UI.isLate(t) && t.dueDate && t.dueDate <= week)],
            ['Later', tasks.filter(t => t.status !== 'done' && t.dueDate && t.dueDate > week)],
            ['No due date', tasks.filter(t => t.status !== 'done' && !t.dueDate)],
            ['Done in the last two weeks', tasks.filter(t => t.status === 'done')]
        ].filter(([, l]) => l.length);
        const open = tasks.filter(t => t.status !== 'done');
        root.innerHTML = `
            <div class="ws-head"><div><h1>My tasks</h1>
                <p class="ws-sub">${open.length} open${label ? ` labelled ${esc(label)}` : ''} across ${new Set(open.map(t => t.client.id)).size} client${new Set(open.map(t => t.client.id)).size === 1 ? '' : 's'}. Each task lives on its client’s board, where the whole team on that client sees it.</p></div></div>
            ${UI.labelBar(all, label)}
            ${groups.length ? groups.map(([g, l]) => `<section class="ws-card" style="margin-bottom:16px"><div class="ws-card-h"><h2>${g}</h2><span class="el-muted ws-num">${l.length}</span></div>
                <div class="ws-rows">${l.map(t => UI.taskRow(t, { showClient: true })).join('')}</div></section>`).join('')
            : label && all.length ? `<div class="ws-empty">${EL.icon('check')}<h3>Nothing of yours labelled ${esc(label)}</h3><p>Pick another label, or Any.</p></div>`
            : `<div class="ws-empty">${EL.icon('check')}<h3>Nothing assigned to you</h3><p>Tasks are made on each client’s board, from a report’s recommendations, or by hand. Anything given to you shows up here.</p><a class="ws-btn" href="clients.html">Go to clients</a></div>`}`;
        root.querySelectorAll('[data-label]').forEach(b => b.addEventListener('click', () => setLabel(b.dataset.label)));
        root.querySelectorAll('[data-task]').forEach(el => {
            const open1 = async () => {
                const t = tasks.find(x => x.id === el.dataset.task); if (!t) return;
                if (!boards.has(t.client.id)) boards.set(t.client.id, await EL.api(`/api/clients/${encodeURIComponent(t.client.id)}/tasks`).catch(() => null));
                const b = boards.get(t.client.id);
                UI.openTask(t, { clientId: t.client.id, clientName: t.client.name, people: b ? b.people : [], canEdit: b ? b.canEdit : false, onSaved: (saved, info = {}) => {
                    // Phase 61: shown at once from the server's answer, then re-read quietly.
                    if (saved && saved.id) { const i = all.findIndex(x => x.id === saved.id); if (i >= 0) { all[i] = { ...all[i], ...saved }; draw(); } }
                    else if (info.deleted) { all = all.filter(x => x.id !== info.deleted); draw(); }
                    load();
                } });
            };
            el.addEventListener('click', open1);
            el.addEventListener('keydown', e => { if (e.key === 'Enter') open1(); });
        });
    }
    load();
})();
</script>
</body>
</html>
