<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://leadgen-backend-1-mgzc.onrender.com">
<title>Clients — EdgeLead</title>
<link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wdth,wght@75..125,300..800&family=Anek+Bangla:wdth,wght@75..125,400..700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
    /* clients.html — page-specific only. Shared rules live in app.css (ws-*). */
    .conn { border: 1px solid rgba(63,191,143,0.35); background: rgba(63,191,143,0.06); border-radius: 10px; padding: 12px 14px; font-size: 0.86rem; color: var(--text-secondary); }
    .conn b { color: var(--text-primary); }
    .cl-name { display: flex; gap: 10px; align-items: center; min-width: 200px; }
</style>
</head>
<body>
<main class="el-page" id="cl"><div class="ws-empty"><p>Loading clients…</p></div></main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="header.js"></script>
<script src="ui.js"></script>
<script>
(async () => {
    'use strict';
    // Old links to a client (bookmarks, the Meta sign-in's return address)
    // carried ?client= here. A client has its own page now; forward, keeping
    // what the Meta return says, before anything else loads.
    const q = new URLSearchParams(location.search);
    if (/^[0-9a-f-]{36}$/i.test(q.get('client') || '')) {
        const u = new URLSearchParams({ client: q.get('client') });
        if (q.get('meta')) { u.set('tab', 'meta'); for (const k of ['meta', 'pages', 'message']) if (q.get(k)) u.set(k, q.get(k)); }
        location.replace('workspace.html?' + u.toString());
        return;
    }

    const me = await EL.init({ engine: null, page: 'clients.html' });
    const esc = v => EL.esc(v);
    const ic = n => EL.icon(n);
    const root = document.getElementById('cl');
    let clients = [], filter = 'all', archived = false;

    async function load() {
        const d = await EL.api('/api/clients' + (archived ? '?archived=1' : ''));
        clients = d.clients || [];
        EL._clients = clients.filter(c => !c.archived);
        draw();
    }

    function metaChip(c) {
        if (c.meta && c.meta.connected) return '<span class="el-chip is-jade">Meta connected</span>';
        if (c.meta && c.meta.pages) return '<span class="el-chip is-warn">Needs attention</span>';
        return '<span class="el-chip">Not connected</span>';
    }

    function draw() {
        const live = clients.filter(c => archived || !c.archived);
        const counts = {
            all: live.length,
            meta: live.filter(c => c.meta && c.meta.connected).length,
            nometa: live.filter(c => !(c.meta && c.meta.connected)).length
        };
        const list = live.filter(c => filter === 'all' || (filter === 'meta' && c.meta && c.meta.connected) || (filter === 'nometa' && !(c.meta && c.meta.connected)));
        const fb = (k, l) => `<button type="button" data-f="${k}" aria-pressed="${filter === k}">${l} <span class="ws-num">${counts[k]}</span></button>`;
        root.innerHTML = `
            <div class="ws-head"><div><h1>Clients</h1>
                <p class="ws-sub">Every report, lead, task, schedule and Meta connection is filed under a client. Add the client first, whether or not you can connect their Meta yet.</p></div>
                <div class="ws-actions"><button class="ws-btn is-gold" type="button" id="cl-add">${ic('plus')}Add client</button></div></div>
            ${me.role !== 'admin' ? '<p class="el-muted" style="margin:-6px 0 14px">You see the clients you own or were added to. An admin can add you to more.</p>' : ''}
            <div id="inbox"></div>
            <div class="ws-filters">${fb('all', 'All')}${fb('meta', 'Meta connected')}${fb('nometa', 'Meta not connected')}
                <button type="button" id="cl-arch" aria-pressed="${archived}">Show archived</button></div>
            ${list.length ? `<div class="ws-table-wrap"><table class="ws-table">
                <thead><tr><th>Client</th><th>Where</th><th>Meta</th><th>Reports</th><th>Your access</th><th>Added</th></tr></thead>
                <tbody>${list.map(c => `<tr class="is-link" data-go="${esc(c.id)}" tabindex="0">
                    <td><div class="cl-name"><span class="el-avatar">${esc(UI.initials(c.name))}</span><div><div class="t">${esc(c.name)}${c.archived ? ' · archived' : ''}</div><div class="s">${esc([c.niche, c.ig_handle ? '@' + c.ig_handle : ''].filter(Boolean).join(' · ') || 'No details yet')}</div></div></div></td>
                    <td class="ws-nowrap">${esc(c.location || '—')}</td>
                    <td>${metaChip(c)}</td>
                    <td class="ws-num">${c.reports ? c.reports.total : 0}</td>
                    <td class="ws-nowrap">${esc({ owner: 'Owner', admin: 'Admin', editor: 'Can edit', viewer: 'Can view' }[c.access] || c.access || '')}</td>
                    <td class="ws-nowrap">${esc(UI.day(c.created_at))}</td></tr>`).join('')}</tbody></table></div>`
            : `<div class="ws-empty">${ic('clients')}<h3>${clients.length ? 'No client matches that filter' : 'No clients yet'}</h3><p>${clients.length ? 'Try another filter.' : 'Add the first one. Only the name is needed; the rest can come later.'}</p>
                ${clients.length ? '' : `<button class="ws-btn is-gold" type="button" data-add>${ic('plus')}Add client</button>`}</div>`}`;

        root.querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', () => { filter = b.dataset.f; draw(); }));
        root.querySelector('#cl-arch').addEventListener('click', () => { archived = !archived; load(); });
        root.querySelectorAll('#cl-add, [data-add]').forEach(b => b.addEventListener('click', () => UI.addClient()));
        root.querySelectorAll('[data-go]').forEach(r => {
            const go = () => { location.href = 'workspace.html?client=' + encodeURIComponent(r.dataset.go); };
            r.addEventListener('click', go);
            r.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
        });
        loadInbox();
    }

    // ---- pages you manage ------------------------------------------------------
    // The agency's path in: one Meta login hands back every Page the account
    // manages, and each can become a client without retyping its name, Page or
    // Instagram handle. Only unfiled Pages are listed, and the panel hides
    // once there are none.
    async function loadInbox() {
        const host = document.getElementById('inbox');
        let d;
        try { d = await EL.api('/api/meta/inbox'); } catch { host.innerHTML = ''; return; }
        const unfiled = (d.pages || []).filter(p => p.needsClient);
        if (!unfiled.length) { host.innerHTML = ''; return; }
        host.innerHTML = `<section class="ws-card" style="margin-bottom:16px">
            <div class="ws-card-h"><div><h2>Pages you manage, not filed yet</h2><p class="el-muted" style="margin-top:4px">Turn one into a client and its Page, Instagram handle and owner numbers come with it, or file it under a client you already have.</p></div></div>
            ${unfiled.map(p => `<div class="conn"><b>${esc(p.pageName || p.pageId)}</b>${p.igUsername ? ` · Instagram <b>@${esc(p.igUsername)}</b>` : ' · no Instagram account linked'}
                <div class="ws-actions" style="margin-top:9px">
                    <button class="ws-btn is-sm" type="button" data-onboard="${esc(p.connectionId)}">Make this a client</button>
                    ${(d.clients || []).length ? `<select data-file="${esc(p.connectionId)}" style="width:auto;min-width:200px"><option value="">File under an existing client…</option>${d.clients.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select>` : ''}
                </div>
                <div class="ws-form two" data-ask="${esc(p.connectionId)}" hidden style="margin-top:10px">
                    <div><label>What they do</label><input data-niche placeholder="e.g. bridal wear"></div>
                    <div><label>Where</label><input data-loc placeholder="City, State"></div>
                    <div><button class="ws-btn is-gold is-sm" type="button" data-create="${esc(p.connectionId)}">Create client</button></div>
                </div></div>`).join('')}
            <div class="ws-note" id="inbox-note"></div></section>`;
        const note = document.getElementById('inbox-note');
        // Niche and location are the two things Meta cannot tell us, and the two
        // the content plan and the comparison set need, so they are asked here.
        host.querySelectorAll('[data-onboard]').forEach(b => b.addEventListener('click', () => {
            const f = host.querySelector(`[data-ask="${b.dataset.onboard}"]`); f.hidden = false; f.querySelector('input').focus();
        }));
        host.querySelectorAll('[data-create]').forEach(b => b.addEventListener('click', async () => {
            const f = host.querySelector(`[data-ask="${b.dataset.create}"]`);
            b.disabled = true; note.className = 'ws-note'; note.textContent = 'Creating…';
            try {
                const r = await EL.api(`/api/meta/connections/${b.dataset.create}/onboard`, { method: 'POST', body: { niche: f.querySelector('[data-niche]').value.trim() || null, location: f.querySelector('[data-loc]').value.trim() || null } });
                location.href = 'workspace.html?client=' + encodeURIComponent(r.client.id) + '&added=1';
            } catch (err) { note.className = 'ws-note is-bad'; note.textContent = err.message; b.disabled = false; }
        }));
        host.querySelectorAll('[data-file]').forEach(sel => sel.addEventListener('change', async () => {
            if (!sel.value) return;
            note.className = 'ws-note'; note.textContent = 'Filing…';
            try { await EL.api(`/api/meta/connections/${sel.dataset.file}`, { method: 'PATCH', body: { clientId: sel.value } }); EL.toast('Filed.'); load(); }
            catch (err) { note.className = 'ws-note is-bad'; note.textContent = err.message; }
        }));
    }

    await load();
    if (q.get('add') === '1' || q.get('new')) UI.addClient();
    if (q.get('meta') === 'ok') EL.toast(`Meta connected (${q.get('pages') || 1} Page${q.get('pages') === '1' ? '' : 's'}). File them below.`);
    if (q.get('meta') === 'error') EL.toast('Meta connection failed: ' + (q.get('message') || 'no reason given'), 'bad');
})();
</script>
</body>
</html>
