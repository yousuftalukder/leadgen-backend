# Config for the site itself. Netlify reads this one AFTER the repo-root
# netlify.toml has set base = "frontend", so this file is already inside the
# base directory and must not set `base` again — doing so resolves to
# frontend/frontend and the deploy finds nothing to publish.
[build]
  publish = "."
  command = ""

# ---------------------------------------------------------------------------
# DOMAIN
#
# The workspace lives at workspace.edgelead.online. The old Netlify address
# still served the whole app, so bookmarks and older email links kept people
# there, signed in on the wrong origin. Send it to the same path on the new
# domain. The host is matched exactly, so deploy previews and branch deploys
# (deploy-preview-N--edgeleadwork.netlify.app) are untouched.
# ---------------------------------------------------------------------------

# The old Netlify address (see DOMAIN below) is matched before everything else.
[[redirects]]
  from = "https://edgeleadwork.netlify.app/*"
  to = "https://workspace.edgelead.online/:splat"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# PHASE 87: THE CRM IS THE WHOLE WORKSPACE
#
# Every older page is closed for now, for everyone, and opens the CRM instead.
# The files stay in the repository; to bring a page back, delete its two lines
# below. 302, not 301, so browsers do not remember the move.
#   /, index.html and welcome.html serve the CRM in place (200): it has its own
#   sign-in, and password-reset links from Supabase land on welcome.html.
#   privacy, terms and data-deletion stay public for Meta's review.
# These come first: Netlify uses the first rule that matches.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "https://ai.edgelead.online/*"
  to = "https://workspace.edgelead.online/crm.html"
  status = 302
  force = true
