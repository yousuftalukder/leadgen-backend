# Business owners use ai.edgelead.online: its front page is Edge Meta AI (ai/),
# served in place so the address stays ai.edgelead.online/. ai/index.html sets
# <base href="../">, which at / is still /, so its files load as they do at /ai/.
# Every other path on that host is the same site as the workspace.
[[redirects]]
  from = "https://ai.edgelead.online/"
  to = "/ai/"
  status = 200
  force = true

# ---------------------------------------------------------------------------
# CACHING
#
# Nothing here is fingerprinted — app.css is always app.css — so the shared
# assets cannot be cached immutably or a deploy would not reach anyone until
# their cache expired.
#
# must-revalidate with a zero max-age is the right trade for this: the browser
# still holds the file and still sends a conditional request, but Netlify
# answers 304 when nothing changed. A repeat visit re-uses the bytes and pays
# only a round trip, and a deploy is picked up immediately.
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Edge Meta AI, the app (phase 47): its page is ai/ — a folder, which the
# *.html rule above does not match — and it has a manifest of its own.
[[headers]]
  for = "/ai/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/ai/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/app.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The service worker must never be served stale, or an old shell outlives a
# deploy; the manifest wants its own type; the icons never change by name.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

