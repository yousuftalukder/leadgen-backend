# Config for the site itself. Netlify reads this one AFTER the repo-root
# netlify.toml has set base = "frontend", so this file is already inside the
# base directory and must not set `base` again.
[build]
  publish = "."
  command = ""

# ---------------------------------------------------------------------------
# PHASE 89: TWO APPS, NOTHING ELSE
#
#   /         the CRM (index.html; sign-in included)
#   /tools    the Tools (tools/index.html): the Apify work, outside the CRM
#   /phone.html  the Phone app (installable)
#   /privacy.html, /terms.html, /data-deletion.html  public, for Meta's review
#
# Every older page was deleted. Their addresses, /crm.html among them, answer
# with a permanent move to /, so bookmarks and old email links still land
# somewhere. Netlify uses the first rule that matches.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "https://edgeleadwork.netlify.app/*"
  to = "https://workspace.edgelead.online/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://ai.edgelead.online/*"
  to = "https://workspace.edgelead.online/"
  status = 301
  force = true
[[redirects]]
  from = "/tools"
  to = "/tools/index.html"
  status = 200
[[redirects]]
  from = "/tools/*"
  to = "/tools/index.html"
  status = 200
